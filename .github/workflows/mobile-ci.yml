name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - test
      - prod
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Install dependencies
        run: npm ci

      - name: Verify unsigned release is rejected
        run: |
          chmod +x android/gradlew
          cd android
          set +e
          output=$(./gradlew assembleRelease --no-daemon 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo 'Release unexpectedly built without signing credentials.' >&2
            exit 1
          fi
          echo "$output" | grep -q 'Release signing is not configured'

      - name: Build Android debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/uichat-mira-mobile-dev.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-android-debug
          path: android/app/build/outputs/apk/debug/uichat-mira-mobile-dev.apk
          if-no-files-found: error
          retention-days: 14

  android-release:
    name: Android signed release APK
    needs:
      - quality
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Install dependencies
        run: npm ci

      - name: Prepare release signing
        env:
          MIRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.MIRA_RELEASE_KEYSTORE_BASE64 }}
          MIRA_RELEASE_STORE_PASSWORD: ${{ secrets.MIRA_RELEASE_STORE_PASSWORD }}
          MIRA_RELEASE_KEY_ALIAS: ${{ secrets.MIRA_RELEASE_KEY_ALIAS }}
          MIRA_RELEASE_KEY_PASSWORD: ${{ secrets.MIRA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$MIRA_RELEASE_KEYSTORE_BASE64"
          test -n "$MIRA_RELEASE_STORE_PASSWORD"
          test -n "$MIRA_RELEASE_KEY_ALIAS"
          test -n "$MIRA_RELEASE_KEY_PASSWORD"
          printf '%s' "$MIRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mira-release.keystore"

      - name: Build signed release APK
        env:
          MIRA_RELEASE_STORE_FILE: ${{ runner.temp }}/mira-release.keystore
          MIRA_RELEASE_STORE_PASSWORD: ${{ secrets.MIRA_RELEASE_STORE_PASSWORD }}
          MIRA_RELEASE_KEY_ALIAS: ${{ secrets.MIRA_RELEASE_KEY_ALIAS }}
          MIRA_RELEASE_KEY_PASSWORD: ${{ secrets.MIRA_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            assembleRelease \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            --stacktrace

      - name: Verify release APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          entries="$RUNNER_TEMP/release-apk-entries.txt"
          test -f "$apk"
          unzip -tq "$apk"
          unzip -Z1 "$apk" > "$entries"
          grep -Fxq 'assets/index.android.bundle' "$entries"
          grep -Fxq 'lib/arm64-v8a/libreact_codegen_rnsvg.so' "$entries"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          release_dir=android/app/build/outputs/apk/release
          cp "$apk" "$release_dir/uichat-mira-mobile-release.apk"
          cd "$release_dir"
          sha256sum uichat-mira-mobile-release.apk > uichat-mira-mobile-release.apk.sha256

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-android-release
          path: |
            android/app/build/outputs/apk/release/uichat-mira-mobile-release.apk
            android/app/build/outputs/apk/release/uichat-mira-mobile-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/UIChatMira.xcworkspace \
            -scheme UIChatMira \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path=$(find ios/build/DerivedData/Build/Products -type d -name '*.app' | head -n 1)
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ios/build/uichat-mira-mobile-ios-simulator.zip

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-ios-simulator
          path: ios/build/uichat-mira-mobile-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  publish-dev-release:
    name: Publish dev prerelease
    needs:
      - quality
      - android
      - android-release
      - ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          test -n "$package_version"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${package_version}-dev" >> "$GITHUB_ENV"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Upload dev artifacts to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 5
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            R2_ACCOUNT_ID \
            R2_BUCKET \
            R2_PUBLIC_BASE_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is missing: ${name}" >&2
              exit 1
            fi
          done

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          latest_prefix="mira/mobile/dev/latest"

          upload() {
            aws s3 sync release-assets/ "s3://${R2_BUCKET}/${latest_prefix}/" \
              --delete \
              --endpoint-url "$endpoint" \
              --cache-control 'public, max-age=300, must-revalidate' \
              --only-show-errors
          }

          for attempt in 1 2 3; do
            if upload; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "R2 upload failed after ${attempt} attempts." >&2
              exit 1
            fi

            sleep $((attempt * 10))
          done

          public_base="${R2_PUBLIC_BASE_URL%/}"
          {
            echo "### Cloudflare R2"
            echo "Latest: ${public_base}/${latest_prefix}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha=${GITHUB_SHA::7}

          cat > release-notes.md <<EOF
          Automated development build from branch \`dev\`.

          - Version: \`$PACKAGE_VERSION\`
          - Commit: \`$GITHUB_SHA\`
          - CI run: \`$GITHUB_RUN_ID\`
          - Android: debug APK and signed release APK
          - iOS: unsigned Simulator app archive, not an IPA
          - R2 mirror: \`${{ secrets.R2_PUBLIC_BASE_URL }}/mira/mobile/dev/latest/\`
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Mira Mobile $PACKAGE_VERSION Dev $short_sha" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Mira Mobile $PACKAGE_VERSION Dev $short_sha" \
              --notes-file release-notes.md \
              --prerelease
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --clobber

          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG" --force

  publish-prod-release:
    name: Publish production release
    needs:
      - quality
      - android
      - android-release
      - ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          test -n "$package_version"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${package_version}" >> "$GITHUB_ENV"

      - name: Download signed Android release
        uses: actions/download-artifact@v4
        with:
          name: uichat-mira-mobile-android-release
          path: release-assets

      - name: Verify downloaded release assets
        run: |
          cd release-assets
          test -f uichat-mira-mobile-release.apk
          test -f uichat-mira-mobile-release.apk.sha256
          sha256sum -c uichat-mira-mobile-release.apk.sha256

      - name: Upload production artifacts to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 5
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          for name in \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY \
            R2_ACCOUNT_ID \
            R2_BUCKET \
            R2_PUBLIC_BASE_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions secret is missing: ${name}" >&2
              exit 1
            fi
          done

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          latest_prefix="mira/mobile/prod/latest"

          upload() {
            aws s3 sync release-assets/ "s3://${R2_BUCKET}/${latest_prefix}/" \
              --delete \
              --endpoint-url "$endpoint" \
              --cache-control 'public, max-age=300, must-revalidate' \
              --only-show-errors
          }

          for attempt in 1 2 3; do
            if upload; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "R2 upload failed after ${attempt} attempts." >&2
              exit 1
            fi

            sleep $((attempt * 10))
          done

          public_base="${R2_PUBLIC_BASE_URL%/}"
          {
            echo "### Cloudflare R2"
            echo "Production: ${public_base}/${latest_prefix}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish rolling production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF_NOTES
          Automated production build from branch \`prod\`.

          - Version: \`$PACKAGE_VERSION\`
          - Commit: \`$GITHUB_SHA\`
          - CI run: \`$GITHUB_RUN_ID\`
          - Android: signed release APK
          - Verification: embedded bundle, SVG native library, APK signature and SHA-256
          - R2 mirror: \`${{ secrets.R2_PUBLIC_BASE_URL }}/mira/mobile/prod/latest/\`
          EOF_NOTES

          remote_tag_sha=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [ -n "$remote_tag_sha" ] && [ "$remote_tag_sha" != "$GITHUB_SHA" ]; then
            echo "Release tag $RELEASE_TAG already points to $remote_tag_sha; bump package.json before publishing another production commit." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Mira Mobile $PACKAGE_VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Mira Mobile $PACKAGE_VERSION" \
              --notes-file release-notes.md
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --clobber
