name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - test
      - prod
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Install dependencies
        run: npm ci

      - name: Verify unsigned release is rejected
        run: |
          chmod +x android/gradlew
          cd android
          set +e
          output=$(./gradlew assembleRelease --no-daemon 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo 'Release unexpectedly built without signing credentials.' >&2
            exit 1
          fi
          echo "$output" | grep -q 'Release signing is not configured'

      - name: Build Android debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/uichat-mira-mobile-dev.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-android-debug
          path: android/app/build/outputs/apk/debug/uichat-mira-mobile-dev.apk
          if-no-files-found: error
          retention-days: 14

  android-release:
    name: Android signed release APK
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Install dependencies
        run: npm ci

      - name: Prepare release signing
        env:
          MIRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.MIRA_RELEASE_KEYSTORE_BASE64 }}
          MIRA_RELEASE_STORE_PASSWORD: ${{ secrets.MIRA_RELEASE_STORE_PASSWORD }}
          MIRA_RELEASE_KEY_ALIAS: ${{ secrets.MIRA_RELEASE_KEY_ALIAS }}
          MIRA_RELEASE_KEY_PASSWORD: ${{ secrets.MIRA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$MIRA_RELEASE_KEYSTORE_BASE64"
          test -n "$MIRA_RELEASE_STORE_PASSWORD"
          test -n "$MIRA_RELEASE_KEY_ALIAS"
          test -n "$MIRA_RELEASE_KEY_PASSWORD"
          printf '%s' "$MIRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mira-release.keystore"

      - name: Build signed release APK
        env:
          MIRA_RELEASE_STORE_FILE: ${{ runner.temp }}/mira-release.keystore
          MIRA_RELEASE_STORE_PASSWORD: ${{ secrets.MIRA_RELEASE_STORE_PASSWORD }}
          MIRA_RELEASE_KEY_ALIAS: ${{ secrets.MIRA_RELEASE_KEY_ALIAS }}
          MIRA_RELEASE_KEY_PASSWORD: ${{ secrets.MIRA_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          entries="$RUNNER_TEMP/release-apk-entries.txt"
          test -f "$apk"
          unzip -tq "$apk"
          unzip -Z1 "$apk" > "$entries"
          grep -Fxq 'assets/index.android.bundle' "$entries"
          grep -Fxq 'lib/arm64-v8a/libreact_codegen_rnsvg.so' "$entries"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" android/app/build/outputs/apk/release/uichat-mira-mobile-release.apk
          sha256sum android/app/build/outputs/apk/release/uichat-mira-mobile-release.apk \
            > android/app/build/outputs/apk/release/uichat-mira-mobile-release.apk.sha256

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-android-release
          path: |
            android/app/build/outputs/apk/release/uichat-mira-mobile-release.apk
            android/app/build/outputs/apk/release/uichat-mira-mobile-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -workspace ios/MyApp.xcworkspace \
            -scheme MyApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path=$(find ios/build/DerivedData/Build/Products -type d -name '*.app' | head -n 1)
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" ios/build/uichat-mira-mobile-ios-simulator.zip

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-ios-simulator
          path: ios/build/uichat-mira-mobile-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  publish-dev-release:
    name: Publish dev prerelease
    needs:
      - quality
      - android
      - ios
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish rolling dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha=${GITHUB_SHA::7}

          cat > release-notes.md <<EOF
          Automated development build from branch \`dev\`.

          - Commit: \`$GITHUB_SHA\`
          - CI run: \`$GITHUB_RUN_ID\`
          - Android: debug APK, installable for testing
          - iOS: unsigned Simulator app archive, not an IPA
          EOF

          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest \
              --title "Mira Mobile Dev $short_sha" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create dev-latest \
              --target "$GITHUB_SHA" \
              --title "Mira Mobile Dev $short_sha" \
              --notes-file release-notes.md \
              --prerelease
          fi

          gh release upload dev-latest release-assets/* --clobber

          git tag -f dev-latest "$GITHUB_SHA"
          git push origin refs/tags/dev-latest --force
