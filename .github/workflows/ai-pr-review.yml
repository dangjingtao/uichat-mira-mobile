# Disabled on 2026-09-03 after migrating automatic PR review to CodeRabbit.
# The implementation is intentionally retained here as a historical/manual fallback.
name: Mira Mobile OpenCode PR Review (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-mobile-opencode-pr-review-disabled-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check OpenCode Go key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error title=Missing OPENCODE_API_KEY::Add repository secret OPENCODE_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Prepare trusted reviewer and sanitized PR snapshot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          REVIEW_DIR="$RUNNER_TEMP/mira-mobile-review-snapshot"
          rm -rf "$REVIEW_DIR"
          mkdir -p "$REVIEW_DIR"

          git archive "$HEAD_SHA" | tar -x -C "$REVIEW_DIR"

          rm -rf \
            "$REVIEW_DIR/.opencode" \
            "$REVIEW_DIR/.claude" \
            "$REVIEW_DIR/.agents"
          rm -f \
            "$REVIEW_DIR/opencode.json" \
            "$REVIEW_DIR/opencode.jsonc" \
            "$REVIEW_DIR/CLAUDE.md" \
            "$REVIEW_DIR/AGENTS.md"

          mkdir -p "$REVIEW_DIR/.opencode/skills/mira-mobile-pr-review"
          git show "$BASE_SHA:AGENTS.md" > "$REVIEW_DIR/AGENTS.md"
          git show "$BASE_SHA:.opencode/skills/mira-mobile-pr-review/SKILL.md" > "$REVIEW_DIR/.opencode/skills/mira-mobile-pr-review/SKILL.md"
          git show "$BASE_SHA:scripts/opencode-mobile-pr-review.mjs" > "$RUNNER_TEMP/opencode-mobile-pr-review.mjs"

          echo "OPENCODE_REVIEW_DIR=$REVIEW_DIR" >> "$GITHUB_ENV"

      - name: Run read-only Mira Mobile review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_REVIEW_MODEL: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode-go/gpt-5.6-luna' }}
          OPENCODE_DISABLE_CLAUDE_CODE: 'true'
          OPENCODE_DISABLE_LSP_DOWNLOAD: 'true'
          OPENCODE_PERMISSION: '{"read":"allow","glob":"allow","grep":"allow","edit":"deny","bash":"deny","task":"deny","lsp":"deny","question":"deny","webfetch":"deny","websearch":"deny","skill":{"*":"deny","mira-mobile-pr-review":"allow"}}'
        run: node "$RUNNER_TEMP/opencode-mobile-pr-review.mjs"

      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: mira-mobile-opencode-pr-review-${{ github.event.pull_request.number }}
          path: ai-review.md
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: review
    if: ${{ needs.review.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout trusted handoff helper from base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download review result
        uses: actions/download-artifact@v4
        with:
          name: mira-mobile-opencode-pr-review-${{ github.event.pull_request.number }}
          path: review-output

      - name: Publish or update Mobile review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          BODY="$(cat review-output/ai-review.md)"
          COMMENT_ID="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --paginate --jq '.[] | select(.body | contains("<!-- mira-mobile-ai-review:v1 -->")) | .id' | tail -n 1)"

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY" >/dev/null
            echo "Updated Mira Mobile OpenCode review comment $COMMENT_ID on PR #$PR_NUMBER."
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
            echo "Created Mira Mobile OpenCode review comment on PR #$PR_NUMBER."
          fi

      - name: Validate local Agent handoff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          node scripts/pull-ai-review.mjs "$PR_NUMBER"
          grep -F -- "- Reviewed Head SHA: $HEAD_SHA" .ai/reviews/latest.md
          grep -F -- "- Stale: no" .ai/reviews/latest.md
          grep -F -- "<!-- mira-mobile-review-skill:v1 -->" .ai/reviews/latest.md
          grep -F -- "<!-- mira-mobile-ai-review:v1 -->" .ai/reviews/latest.md
          echo "Mira Mobile local Agent handoff validated for PR #$PR_NUMBER at $HEAD_SHA."
