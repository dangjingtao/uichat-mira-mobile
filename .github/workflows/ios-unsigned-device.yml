name: iOS Unsigned Device Build

on:
  pull_request:
    branches:
      - dev
      - test
      - prod
    paths:
      - '.github/workflows/ios-unsigned-device.yml'
      - 'ios/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Gemfile'
      - 'Gemfile.lock'
  push:
    branches:
      - dev
      - test
      - 'feature/**'
      - 'fix/**'
    paths:
      - '.github/workflows/ios-unsigned-device.yml'
      - 'ios/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
      - 'Gemfile'
      - 'Gemfile.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail

          derived_data='ios/build/UnsignedDeviceDerivedData'
          rm -rf "$derived_data"

          xcodebuild \
            -workspace ios/UIChatMira.xcworkspace \
            -scheme UIChatMira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package and verify unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          derived_data='ios/build/UnsignedDeviceDerivedData'
          products_dir="$derived_data/Build/Products/Release-iphoneos"
          app_path=$(find "$products_dir" -maxdepth 1 -type d -name '*.app' -print -quit)

          if [ -z "$app_path" ]; then
            echo 'No Release-iphoneos .app bundle was produced.' >&2
            exit 1
          fi

          test -f "$app_path/Info.plist"
          test -f "$app_path/main.jsbundle"

          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")
          test -n "$executable"
          test -f "$app_path/$executable"

          archs=$(lipo -archs "$app_path/$executable")
          echo "Device executable architectures: $archs"
          printf '%s\n' "$archs" | tr ' ' '\n' | grep -Fxq arm64

          package_dir='ios/build/unsigned-device-package'
          ipa='ios/build/uichat-mira-mobile-ios-unsigned-device.ipa'
          checksum="$ipa.sha256"

          rm -rf "$package_dir" "$ipa" "$checksum"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/$(basename "$app_path")"

          (
            cd "$package_dir"
            ditto -c -k --sequesterRsrc --keepParent Payload "../$(basename "$ipa")"
          )

          unzip -tq "$ipa"
          entries="$RUNNER_TEMP/ios-unsigned-device-entries.txt"
          unzip -Z1 "$ipa" > "$entries"
          grep -Eq '^Payload/[^/]+\.app/Info\.plist$' "$entries"
          grep -Eq '^Payload/[^/]+\.app/main\.jsbundle$' "$entries"

          if grep -Eq '^Payload/[^/]+\.app/embedded\.mobileprovision$' "$entries"; then
            echo 'Unsigned IPA unexpectedly contains an embedded provisioning profile.' >&2
            exit 1
          fi

          (
            cd "$(dirname "$ipa")"
            shasum -a 256 "$(basename "$ipa")" > "$(basename "$checksum")"
          )

      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: uichat-mira-mobile-ios-unsigned-device
          path: |
            ios/build/uichat-mira-mobile-ios-unsigned-device.ipa
            ios/build/uichat-mira-mobile-ios-unsigned-device.ipa.sha256
          if-no-files-found: error
          retention-days: 14
