name: R2 Release Truth

on:
  push:
    branches:
      - predev
      - dev
      - test
      - prod
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r2-release-truth-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_CHANNEL: ${{ github.ref_name }}

jobs:
  publish-r2-release-truth:
    name: Publish branch-isolated R2 release truth
    runs-on: ubuntu-latest
    steps:
      - name: Validate release channel
        shell: bash
        run: |
          case "$RELEASE_CHANNEL" in
            predev|dev|test|prod) ;;
            *)
              echo "Unsupported release branch: $RELEASE_CHANNEL" >&2
              exit 1
              ;;
          esac

      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Wait for canonical branch CI
        id: source-ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$RELEASE_CHANNEL" = 'predev' ]; then
            workflow_file='predev-ci.yml'
          else
            workflow_file='mobile-ci.yml'
          fi

          source_run_id=''
          for attempt in $(seq 1 180); do
            source_run_id=$(gh api \
              --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs" \
              -f head_sha="$GITHUB_SHA" \
              -f event='push' \
              -f per_page=20 \
              --jq '.workflow_runs[0].id // empty')

            if [ -z "$source_run_id" ]; then
              sleep 10
              continue
            fi

            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}" --jq '.status')
            if [ "$status" != 'completed' ]; then
              sleep 10
              continue
            fi

            conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run_id}" --jq '.conclusion')
            if [ "$conclusion" != 'success' ]; then
              echo "Canonical ${workflow_file} run ${source_run_id} concluded ${conclusion}; R2 release truth will not move." >&2
              exit 1
            fi

            echo "run_id=${source_run_id}" >> "$GITHUB_OUTPUT"
            echo "Canonical CI succeeded: ${workflow_file} run ${source_run_id}"
            exit 0
          done

          echo "Timed out waiting for canonical ${workflow_file} run for ${GITHUB_SHA}." >&2
          exit 1

      - name: Download signed release from canonical CI
        if: env.RELEASE_CHANNEL != 'test'
        uses: actions/download-artifact@v4
        with:
          name: uichat-mira-mobile-android-release
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source-ci.outputs.run_id }}

      - name: Set up Java for test release
        if: env.RELEASE_CHANNEL == 'test'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK for test release
        if: env.RELEASE_CHANNEL == 'test'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages for test release
        if: env.RELEASE_CHANNEL == 'test'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'

      - name: Install dependencies for test release
        if: env.RELEASE_CHANNEL == 'test'
        run: npm ci

      - name: Prepare test release signing
        if: env.RELEASE_CHANNEL == 'test'
        env:
          MIRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.MIRA_RELEASE_KEYSTORE_BASE64 }}
          MIRA_RELEASE_STORE_PASSWORD: ${{ secrets.MIRA_RELEASE_STORE_PASSWORD }}
          MIRA_RELEASE_KEY_ALIAS: ${{ secrets.MIRA_RELEASE_KEY_ALIAS }}
          MIRA_RELEASE_KEY_PASSWORD: ${{ secrets.MIRA_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MIRA_RELEASE_KEYSTORE_BASE64"
          test -n "$MIRA_RELEASE_STORE_PASSWORD"
          test -n "$MIRA_RELEASE_KEY_ALIAS"
          test -n "$MIRA_RELEASE_KEY_PASSWORD"
          printf '%s' "$MIRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mira-release.keystore"

      - name: Build signed test release APK
        if: env.RELEASE_CHANNEL == 'test'
        env:
          MIRA_RELEASE_CHANNEL: test
          MIRA_RELEASE_CHANNEL_LOCKED: 'true'
          MIRA_RELEASE_STORE_FILE: ${{ runner.temp }}/mira-release.keystore
          MIRA_RELEASE_STORE_PASSWORD: ${{ secrets.MIRA_RELEASE_STORE_PASSWORD }}
          MIRA_RELEASE_KEY_ALIAS: ${{ secrets.MIRA_RELEASE_KEY_ALIAS }}
          MIRA_RELEASE_KEY_PASSWORD: ${{ secrets.MIRA_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            assembleRelease \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            --stacktrace

      - name: Prepare signed test release artifact
        if: env.RELEASE_CHANNEL == 'test'
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          entries="$RUNNER_TEMP/test-release-apk-entries.txt"
          test -s "$apk"
          unzip -tq "$apk"
          unzip -Z1 "$apk" > "$entries"
          grep -Fxq 'assets/index.android.bundle' "$entries"
          grep -Fxq 'lib/arm64-v8a/libreact_codegen_rnsvg.so' "$entries"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p release-assets
          cp "$apk" release-assets/uichat-mira-mobile-release.apk
          (
            cd release-assets
            sha256sum uichat-mira-mobile-release.apk > uichat-mira-mobile-release.apk.sha256
          )

      - name: Verify signed release artifact
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -s uichat-mira-mobile-release.apk
          test -s uichat-mira-mobile-release.apk.sha256
          sha256sum -c uichat-mira-mobile-release.apk.sha256

      - name: Generate branch release manifest
        env:
          MIRA_RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
        run: node scripts/create-r2-latest-manifest.js release-assets

      - name: Publish versioned assets and latest manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: 5
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/publish-r2-release-truth.sh "$RELEASE_CHANNEL" release-assets

          if [ -n "${R2_PUBLIC_BASE_URL:-}" ]; then
            version=$(node -e "const m=require('./release-assets/latest.json'); process.stdout.write(m.version)")
            public_base="${R2_PUBLIC_BASE_URL%/}"
            {
              echo "### R2 release truth"
              echo "Channel: ${RELEASE_CHANNEL}"
              echo "Manifest: ${public_base}/mira/mobile/${RELEASE_CHANNEL}/latest/latest.json"
              echo "Versioned APK: ${public_base}/mira/mobile/${RELEASE_CHANNEL}/releases/${version}/uichat-mira-mobile-release.apk"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
