name: Patch Shiyan Canonical Truth

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/patch-shiyan-truth.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Update Shiyan canonical LLM truth
        shell: python
        run: |
          from pathlib import Path

          readme = Path('docs/shiyan/README.md')
          text = readme.read_text()
          old = '- LLM 不要求使用 Workers AI；使用独立轻量 LLM 服务层统一保管现有 Provider Key、基础路由、fallback 与错误归一。'
          new = '''- LLM 不要求使用 Workers AI；`shiyan-llm` 使用 AI SDK v6 + `@ai-sdk/openai-compatible` 作为 OpenAI-compatible 协议层，不绑定 DeepSeek / Kimi / 火山等具体厂商。
          - primary 的最小配置合同为 `LLM_PRIMARY_BASE_URL` + `LLM_PRIMARY_MODEL` + `LLM_PRIMARY_API_KEY`；`LLM_PRIMARY_PROVIDER` 仅为可选观测标签。
          - fallback 整组为可选；配置时使用对应 `LLM_FALLBACK_*` 键。
          - Base URL / Model 等非敏感配置放 Cloudflare Vars，API Key 放 Cloudflare Secrets；部署不得把 Secret 写入仓库或日志。
          - 2026-08-31 已验证 AI SDK 在 Cloudflare Workers 上通过类型检查、全部拾言测试、public/private Worker dry-run；真实 dev 部署仍依赖 `SHIYAN_D1_DATABASE_ID` 等环境前置。'''
          if text.count(old) != 1:
              raise SystemExit(f'README expected one legacy LLM truth; got {text.count(old)}')
          readme.write_text(text.replace(old, new, 1))

          tech = Path('docs/shiyan/TECHNICAL_DESIGN.md')
          text = tech.read_text()

          replacements = [
              ('日期：2026-08-29', '初版日期：2026-08-29\n\n最近核对：2026-08-31'),
              (' DeepSeek / Volcano / Kimi / other OpenAI-compatible providers', ' Any OpenAI-compatible provider'),
              ('''- Provider 适配。
          - 默认 Provider + 一个 fallback。
          - 结构化输出校验。''', '''- OpenAI-compatible Provider 适配，协议层使用 AI SDK v6 + `@ai-sdk/openai-compatible`。
          - 一个 primary + 可选 fallback；不得在业务合同中绑定具体厂商。
          - primary 最小配置为 `LLM_PRIMARY_BASE_URL`、`LLM_PRIMARY_MODEL`、`LLM_PRIMARY_API_KEY`；`LLM_PRIMARY_PROVIDER` 仅作可选观测标签。
          - fallback 使用对应 `LLM_FALLBACK_*` 键，整组可不配置。
          - 非敏感 endpoint / model 配置使用 Cloudflare Vars，API Key 使用 Cloudflare Secrets；部署保留控制台 Vars，不将凭据写入仓库。
          - 结构化输出校验。'''),
              ('''interface LlmGateway {
            generateStructured(input: OrganizeRequest): Promise<OrganizeResult>
          }
          ```

          错误只允许表达 Provider 层事实，例如：''', '''interface LlmGateway {
            generateStructured(input: OrganizeRequest): Promise<OrganizeResult>
          }
          ```

          当前已验证工程事实（2026-08-31）：AI SDK 依赖安装、Cloudflare runtime types、TypeScript、全部拾言测试、`shiyan-api` dry-run、`shiyan-llm` dry-run 与本地 D1 migration 校验均已通过。该结论只证明实现与 Cloudflare Workers 构建合同成立，不等价于真实 dev 环境已经完成部署；实际部署仍受 D1 ID、运行时 Secrets / Vars 等环境前置约束。

          错误只允许表达 Provider 层事实，例如：'''),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'TECHNICAL_DESIGN expected one match, got {text.count(old)} for: {old[:60]!r}')
              text = text.replace(old, new, 1)

          tech.write_text(text)

      - name: Commit canonical truth update
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/shiyan/README.md docs/shiyan/TECHNICAL_DESIGN.md
          git commit -m 'docs: sync Shiyan OpenAI-compatible LLM truth'
          git push origin HEAD:dev
